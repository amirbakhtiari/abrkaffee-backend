services:
  postgres_test:
    image: postgres:16-alpine
    container_name: abrcoffee_postgres_test
    environment:
      POSTGRES_USER: abrcoffee_test
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: abrcoffee_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abrcoffee_test -d abrcoffee_test"]
      interval: 3s
      timeout: 5s
      retries: 10